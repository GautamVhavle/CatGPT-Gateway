name: Docker Image CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag to publish"
        required: true
        type: string
      publish_latest:
        description: "Also publish the image as latest"
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate version tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [[ "$VERSION" == "main" ]]; then
            echo "The manual version tag cannot be 'main'." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $VERSION" >&2
            exit 1
          fi

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          VERSION: ${{ inputs.version }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail
          {
            echo "value<<EOF"
            if [[ "$PUBLISH_LATEST" == "true" ]]; then
              echo "$IMAGE:latest"
            fi
            echo "$IMAGE:$VERSION"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
